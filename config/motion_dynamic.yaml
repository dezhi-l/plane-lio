# Wheel / NHC / ZUPT / bias-limit / bias-random-walk + dynamic filter on top of a base config (keys go under `lio:`).
# All motion terms are observations in the IESKF measurement update (core/src/motion_obs.cpp), fused with the LiDAR residual.
# CLI flags --wheel --nhc --zupt --bias-limit --bias-rw override the yaml switches.
#   wheel_enable / nhc_enable: true      wheel_gain / nhc_gain: 100 (1/sigma^2, (m/s)^-2)
#   wheel_scale: 1.0   wheel_max_dt: 0.5   wheel_ext_rot: [9]   wheel_ext_pos: [3]   (wheel/base -> IMU)
#   zupt_enable: false  zupt_speed: 0.05  zupt_count: 5  zupt_gyro_thresh: 0.02  zupt_vel_gain/zupt_gyro_gain: 1e4  zupt_acc_gain: 0
#   bias_limit_enable: false  bg_max: 0.2  ba_max: 1.0  bias_limit_gain: 1e4
#   bias_random_walk: false  (proper continuous bias RW; then gyro_bias_cov/acc_bias_cov are PSD, use ~1e-6..1e-7, not 1e-4)
preprocess:
  blind: 0.5
  point_stride: 1
lio:
  residual: gicp
  scan_resolution: 0.4
  map_resolution: 0.4
  near_mode: 1
  max_iterations: 10
  p2plane_gain: 1000
  p2plane_robust_delta: 0.1
  plane_thresh: 0.1
  knn: 5
  gicp_gain: 100
  degen_ratio: 0.003
  wheel_enable: true
  nhc_enable: true
  wheel_gain: 100
  nhc_gain: 100
  acc_cov: 0.1
  gyro_cov: 0.1
  align_gravity: true
  extrinsic_est_en: false
  imu_ext_rot: [1, 0, 0, 0, 1, 0, 0, 0, 1]
  imu_ext_pos: [0, 0, 0]
  dynamic:
    enable: true
    appear_thresh: 0.8
loop_closure:
  enable: true
  key_dist_thresh: 1.0
  key_rot_thresh: 0.2
  time_thresh: 30.0
  index_thresh: 25
  search_radius: 10.0
  submap_half_window: 10
  icp_max_corr: 2.0
  icp_fitness_thresh: 0.3
